version: '3.8'

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: acelera_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d store_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  webapi:
    image: acelera-app:latest
    container_name: acelera_webapi
    build:
      context: ./sources/Acelera.App
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__PostgresDb=Host=${POSTGRES_HOST};Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
    depends_on:
      postgresdb:
        condition: service_healthy

volumes:
  pg_data:
