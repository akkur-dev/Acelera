name: .NET & Docker Build Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [ "main" ]

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: '^(feat|fix|docs):\s[A-Za-z0-9]+-\d+-[A-Za-z0-9-]+$'
          subjectPatternError: |
            Имя pull request не соответствует Conventional Commits

  validate-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Compose
      run: docker compose build

    - name: Run .NET Build
      run: dotnet build sources/Acelera.App/Acelera.App.csproj --configuration Release
